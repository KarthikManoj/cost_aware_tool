aws:
  region: ap-south-1
  s3_bucket: your-s3-bucket-name
  s3_prefix: spark-workloads
  emr_release_label: emr-6.15.0
  log_uri: s3://your-s3-bucket-name/emr-logs/
  spark_py_files_uri: s3://your-s3-bucket-name/spark-workloads/packages/spark_jobs.zip

datasets:
  sizes_mb: [100, 500, 1024, 2048, 3072, 5120]
  format: csv

workloads:
  - cpu-heavy
  - memory-heavy
  - io-heavy

cluster:
  applications: [Spark]
  ec2_key_name: "cost-aware-emr-key"
  subnet_id: subnet-REPLACE_ME_AP_SOUTH_1
  service_role: EMR_DefaultRole
  job_flow_role: EMR_EC2_DefaultRole
